aid: buxfer
name: Buxfer
description: >-
  Buxfer is a personal finance and money management platform that consolidates
  bank, investment and retirement accounts in one place. It connects to 20,000+
  banks across 70+ countries, tracks assets in 100+ currencies, and provides
  budgeting with real-time alerts, expense forecasting, net-worth projection,
  automatic transaction tagging with custom rules, investment and retirement
  planning, shared-expense groups, and encrypted cloud backups to Dropbox,
  Google Drive or OneDrive. Buxfer exposes a JSON HTTP API for reading accounts,
  transactions, tags, budgets, reminders, groups, contacts and loans, and for
  creating, editing and deleting transactions and uploading statements.
  Authentication uses a login call that returns an ephemeral token passed on
  every subsequent request. Buxfer is a Y Combinator company.
