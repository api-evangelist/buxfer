  model: login-token
  notes: >-
    Buxfer does not use OAuth. A client authenticates once with the account
    email and password via the login operation, which returns a unique ephemeral
    token. That token is then passed as a `token` query parameter on every
    subsequent request. There are no OAuth scopes; access is full-account.
