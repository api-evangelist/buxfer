overlay: 1.0.0
info:
  title: API Evangelist enhancements for Buxfer API
  version: 1.0.0
extends: openapi/buxfer-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-rating: 3
    x-apievangelist-auth-model: login-token
    x-apievangelist-source: https://www.buxfer.com/help/api
- target: $.info
  update:
    x-apievangelist-notes: >-
      Spec generated by the API Evangelist enrichment pipeline as a faithful
      representation of the publicly documented Buxfer API; Buxfer does not
      publish an OpenAPI definition of its own.
- target: $.paths['/transactions'].get
  update:
    x-apievangelist-pagination:
      style: page-number
      param: page
      page_size: 100
